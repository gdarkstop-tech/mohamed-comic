# House style for every panel: the look of the author's approved WEAVER art
# (Chapter One cover and the friends portraits), NOT the flatter inked style of
# the support-network page, which the author rejected on 2026-10-21.
#
# Style is anchored by references: each character's own approved drawn version
# (see "refs" in characters.yaml) carries the style. style_ref is the fallback
# for panels with no drawn character reference.

style_ref: cairo_night_skyline        # cover-style Cairo night (no lettering)
setting_ref: cairo_night_skyline      # Nile, lit bridges, pyramids for exteriors

# Opening words of every prompt; the model weighs them most. The author picked
# test #4 (2026-10-21, flux-2-klein-9b) as the closest to Mohamed and to the comic:
# a painted comic-book-cover look WITH subtle ink outlines. Plain "comic book
# panel" / heavy inks gave flat line-art (rejected), and "semi-realistic poster
# painting" without inks left the comic look and lost the likeness (rejected).
medium: Semi-realistic digital comic painting, premium comic book cover quality

description: >-
  semi-realistic digital painting like a premium comic book cover: realistic
  detailed faces with soft painted skin shading, expressive eyes, finely detailed
  hair, painterly rendering with subtle ink outlines, vivid saturated colours,
  dramatic cinematic lighting with warm orange city glow against deep blue night,
  glowing highlights and soft rim light, highly detailed background, set in
  present-day Cairo, Egypt

# FLUX does not use negative prompts; lettering is added later by the compositor,
# so the image itself must contain none.
no_text: >-
  No text, letters, words, numbers, speech bubbles, captions, signatures, logos or
  watermarks anywhere in the image, including on clothing. Full-bleed single
  illustration with no frame and no panel borders.

identity_rule: >-
  Keep each person's real facial features, face shape, hairstyle and glasses exactly
  as in their reference images.
