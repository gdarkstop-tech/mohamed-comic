# Reference image registry. Committed: holds only file names and crop boxes.
# The images themselves live in the git-ignored private/references/ folder:
#   private/references/source/  approved WEAVER artwork (cover, sheets, lineups)
#   private/references/photos/  real photos, one per person: <character>.<ext>
#
# box:      absolute crop [left, top, right, bottom] in source pixels
# box_rel:  relative crop (0..1), used for photos whose resolution may vary
# masks:    absolute boxes painted white before cropping (hide stray lettering)
# kind:     photo = real person (highest identity priority), art = approved artwork
# role:     identity | outfit | costume | style | setting | detail
#
# Crops deliberately exclude captions, name labels and logos so the model does
# not copy lettering into panels. Check them with: python -m weaver refs preview

references:
  # ---------------------------------------------------------------- real photos
  mohamed_photo:     {source: photos/mohamed.*,     box_rel: [0.26, 0.00, 0.60, 0.66], kind: photo, role: identity}
