# WEAVER character bible. Visual descriptions are taken from the approved
# artwork and the real reference photos; roles are the captions on that artwork.
#
# refs: ordered by priority. For each character the pipeline sends the first
# AVAILABLE identity reference (a real photo beats artwork), then fills spare
# slots with style / outfit references. Max 4 images per request.
#
# OPEN QUESTIONS for the author are marked "# Q:".

characters:
  mohamed:
    name: Mohamed Wessam
    role: The protagonist. "One night that wasn't normal changed Mohamed's life forever."
    # Canon (Volume One): "young Egyptian man, big voluminous dark curly hair, thin
    # round glasses (always on), slim build, warm brown skin. Default look: beige
    # overshirt over a white graphic tee, jeans, black backpack."
    # Author correction 2026-10-21: Mohamed is FAIR-skinned, not brown. Face shape
    # taken from his real photo (test #4 drew him too long-faced).
    look: >-
      young Egyptian man, round face with soft full cheeks, big voluminous dark curly
      hair, thin round glasses (always on), slim build, fair light skin
    # "graphic tee" is kept wordless: the model otherwise invents lettering on it.
    outfit: beige overshirt over a white T-shirt with a small abstract graphic print, jeans, black backpack
    # Photo first (real face), then Mohamed as drawn on the approved cover (the
    # face in the house style). mohamed_outfit_art (cover) shows a black spider
    # tee, which is not his canon default look, so it is not an outfit reference.
    refs: [mohamed_photo, mohamed_cover_art, mohamed_face_art]

  weaver:
    name: The Spider (WEAVER)
    role: Masked hero in the WEAVER suit. "From a mysterious rescue..."
    # Q: Is the Spider on the cover a separate person, or Mohamed later on?
    #    Mohamed holds a spider mask on the cover and the "First Gear" sheet
    #    shows a curly-haired wearer. The pilot keeps the identity hidden.
    look: >-
      masked figure, face fully covered by a dark navy mask with round glowing amber
      goggle lenses under a deep crimson hood
    outfit: >-
      dark navy armoured bodysuit with crimson panels, gold spider emblem across the
      chest with a glowing blue diamond "Sky Stone" at its centre, long tattered
      crimson hooded coat, gold lotus-engraved bracers, belt with an Eye of Horus
      buckle, fingerless gloves, crimson-and-navy boots with gold trim
    refs: [weaver_suit_front, weaver_cover_pose, weaver_suit_back]

  weaver_first_gear:
    name: WEAVER (first gear)
    role: Early home-made version of the WEAVER look.
    look: curly dark hair under a red hood, round brass goggles, navy cloth face mask
    outfit: >-
      red hoodie with an orange spider print, black gloves, mechanical wrist launchers,
      faded blue cargo jeans, red-and-white sneakers, black backpack
    refs: [weaver_first_gear]

  # ----------------------------------------------------------------- friends
  # Looks and outfits follow the canon (Volume One, "THE SQUAD" and "THE
  # GROWN-UPS" sheets). Skin tone is not stated there: it comes from the photo
  # or the approved artwork.
  abdulrahman:
    name: Abdulrahman
    role: The tech genius.
    look: >-
      young Egyptian man, short dark hair with faded sides, rectangular dark-framed
      glasses, athletic gym-trained build (broad shoulders, strong arms), clean-shaven
    outfit: black polo shirt, black trousers, silver wristwatch
    refs: [abdulrahman_photo, abdulrahman_art, abdulrahman_body_art]

  jana:
    name: Jana
    role: The mind and the heart.
    look: >-
      young Egyptian woman, always in a black hijab with a thin white under-scarf band
      at the forehead (no hair ever visible), round face, big warm smile, brown eyes
    outfit: >-
      black shirt with an open black overshirt, thin gold chain necklace, light-blue
      jeans with a black belt, white sneakers
    refs: [jana_photo, jana_art, jana_body_art]

  ahmed:
    name: Ahmed
    role: The professor.
    look: >-
      young Egyptian man, pharmacy student, short dark hair faded on the sides, short
      dark beard along the jaw and a light moustache, warm brown eyes, big reassuring smile
    outfit: >-
      royal-blue varsity jacket with a dark-red striped collar over a white T-shirt,
      backpack, small first-aid pouch on his belt
    refs: [ahmed_photo, ahmed_art, ahmed_body_art]

  adham:
    name: Adham
    role: Muscles and laughs.
    look: >-
      young Egyptian man with a very muscular gym body (big arms, broad chest), short
      dark hair under a backwards dark cap, full short dark beard, calm half-smile
    outfit: >-
      football jersey split half dark red and half navy blue with no logos and no
      sponsor text, dark track pants
    # Q: Bondo's caption says "Adam's close friend" - is "Adam" Adham?
    refs: [adham_photo, adham_art, adham_body_art]

  aliyy:
    name: Aliyy
    role: Omar's best friend (not Ali).
    # Canon: aged to his early forties; the friends lineup art still shows him young.
    look: >-
      Egyptian man in his early forties, short dark curly hair with a little grey,
      friendly grin
    outfit: navy-and-white horizontal striped T-shirt (his signature), dark blue jeans
    refs: [aliyy_photo, aliyy_art, aliyy_body_art]

  ali:
    name: Ali
    role: Always just in time.
    look: >-
      young Egyptian man around 20, big messy dark curly hair, thick black rectangular
      glasses (not round, so he never looks like Mohamed), calm serious eyes
    outfit: >-
      black hoodie, thin silver chain bracelet, a watch-like device with a glowing
      blue-white ring on his left wrist
    refs: [ali_photo, ali_art, ali_body_art]

  omar:
    name: Omar
    role: Owner of Nile Group.
    # Canon: aged to his early forties; the friends lineup art still shows him young.
    look: >-
      Egyptian businessman in his early forties, a little grey at the temples, mature
      confident face, short dark curly hair, clean-shaven, sharp jaw, calm eyes
    outfit: tailored black suit over a black shirt, wristwatch
    refs: [omar_photo, omar_art, omar_body_art]

  # ----------------------------------------------------------- support network
  amm_ramadan:
    name: Amm Ramadan
    role: The safe house. His shop is the front; the underground is the base.
    look: elderly man, bald crown with grey hair at the sides, thick grey moustache, warm grin
    outfit: loose off-white galabeya-style shirt, prayer beads, glass of tea in hand
    refs: [amm_ramadan_art]
  amm_fathy:
    name: Amm Fathy
    role: The mechanic. Builds and upgrades the gear.
    look: middle-aged man, curly salt-and-pepper hair, grey stubble beard, tired focused eyes
    outfit: navy mechanic's work shirt, work gloves
    refs: [amm_fathy_art]
  major_yassin:
    name: Major Yassin
    role: The officer. Intel, security support and legal cover.
    look: middle-aged man, slicked dark hair greying at the temples, thick moustache, stern look
    outfit: black Egyptian police officer's uniform with rank stars on the shoulders
    refs: [major_yassin_art]
  mai_fawzy:
    name: Mai Fawzy
    role: The photographer. Captures the truth and exposes corruption.
    look: young woman, long dark wavy hair, sharp eyes
    outfit: black jacket, professional DSLR camera
    refs: [mai_fawzy_art]
  dr_nermeen:
    name: Dr. Nermeen
    role: The doctor. Guides Ahmed on the science and the serum.
    look: woman in a light beige hijab, calm intelligent expression
    outfit: white lab coat over navy scrubs, stethoscope
    refs: [dr_nermeen_art]
  bondo:
    name: Bondo'
    role: The street kid. Parkour expert, scouts areas, gives access.
    look: teenage boy, big dark curly hair, lively eyes
    outfit: grey hoodie under a red-and-black jacket
    refs: [bondo_art]

  # ------------------------------------------------------------------ villains
  voltage:
    name: Voltage
    look: hulking figure in black segmented armour with a dark visored helmet
    outfit: glowing blue electric coils around both forearms, crackling lightning
    refs: [voltage_art]
  vesper:
    name: Vesper
    look: slender woman in a hooded purple bodysuit with a smooth purple visor
    outfit: floating purple crystal drones around her
    refs: [vesper_art]
  goliath:
    name: Goliath
    look: enormous bald man with grey-brown stitched skin and a sad tired face
    outfit: torn grey trousers, wristband marked H-07, barefoot
    refs: [goliath_art]
  sentinel:
    name: Sentinel
    look: sleek white-and-gold android with an ancient-Egyptian styled face mask and glowing blue eyes
    outfit: white armour plating with gold Egyptian line patterns
    refs: [sentinel_art]
  kamal_raslan:
    name: Kamal Raslan
    look: bald middle-aged man with a short grey beard and a cold stare
    outfit: black suit, black tie, gold watch, often on the phone
    refs: [kamal_raslan_art]
  turned_microbus_driver:
    name: The Turned (microbus driver)
    look: man transformed into a creature with cracked grey-black skin, glowing amber eyes, bony spikes on the shoulders
    outfit: torn beige short-sleeve shirt, ragged trousers
    refs: [turned_microbus_art]
  turned_delivery_rider:
    name: The Turned (delivery rider)
    look: creature with cracked grey skin, glowing amber eyes, spikes along the arms and back
    outfit: red motorcycle helmet, torn red-and-black delivery jacket, boots
    refs: [turned_delivery_art]
