# WEAVER pipeline settings. Safe to commit: this file never contains secrets.
# Secrets live only in environment variables or the git-ignored .env file.

provider:
  name: cloudflare
  model: "@cf/black-forest-labs/flux-2-klein-4b"
  request_timeout_s: 180
  # Retries apply only to transient failures (capacity 3040, timeouts, 5xx).
  # Quota exhaustion (3036) is never retried.
  max_retries: 3

quota:
  # Workers AI gives 10,000 free neurons per UTC day (reset 00:00 UTC).
  # The pipeline refuses to START a request that could push today's usage
  # past daily_neuron_cap, so this tool never consumes billable overage even
  # if the account were ever moved to Workers Paid.
  free_allocation: 10000
  daily_neuron_cap: 9000

references:
  max_side: 512          # Cloudflare: every input image must fit within 512x512
  max_per_request: 4     # FLUX.2 [klein] 4B accepts input_image_0 .. input_image_3

generation:
  target_megapixels: 1.0
  min_side: 256          # model limits: 256-1920 px per side
  max_side: 1920
  multiple_of: 16

page:
  # 6.625 x 10.1875 in (standard US comic trim) at 300 dpi
  width: 1988
  height: 3056
  dpi: 300
  margin: 84
  gutter: 30
  border: 6
